# Normalisation of raw senses. Run:
#   uv run python -m senselm.inventory.normalise --config configs/normalise.yaml
stage: inventory.normalise
input: data/interim/senses_raw.parquet
outputs:
  senses: data/interim/senses_norm.parquet
  forms: data/interim/forms.parquet
  variants: data/interim/variants.parquet
  dedupe_map: data/interim/dedupe_map.parquet
batch_rows: 50000

# Lemma normalisation: NFC, whitespace collapsed, these characters mapped. Case is preserved
# (Polish != polish). See docs/DECISIONS.md D-008.
lemma_char_map:
  "’": "'"   # right single quotation mark
  "‘": "'"   # left single quotation mark
  "ʼ": "'"   # modifier letter apostrophe
  "‐": "-"   # hyphen
  "‑": "-"   # non-breaking hyphen

# Source POS -> Universal POS (UPOS). Unmapped labels are dropped (counted in stats).
upos_map:
  wiktionary:
    noun: NOUN
    name: PROPN
    verb: VERB
    adj: ADJ
    adv: ADV
    adv_phrase: ADV
    prep_phrase: ADV      # "in vain", "at hand": adverbial PPs (D-009)
    phrase: X
    proverb: X
    intj: INTJ
    pron: PRON
    det: DET
    article: DET
    num: NUM
    prep: ADP
    postp: ADP
    conj: CONJ            # CCONJ if the lemma is in coordinating_conjunctions, else SCONJ
    particle: PART
    contraction: X
    prefix: X
    suffix: X
    infix: X
    interfix: X
    circumfix: X
    affix: X
    symbol: SYM
    character: SYM
    punct: PUNCT
  oewn:
    n: NOUN               # PROPN when oewn_propn_when matches
    v: VERB
    a: ADJ
    s: ADJ                # adjective satellite
    r: ADV
  # ------------------------------------------------------------------ Phase 2 sources
  # Wikidata lexical categories (meanings read off the data, see D-033)
  wikidata_lexemes:
    Q1084: NOUN          # noun
    Q24905: VERB         # verb
    Q34698: ADJ          # adjective
    Q380057: ADV         # adverb
    Q147276: PROPN       # proper noun
    Q576271: DET         # determiner (incl. cardinal numbers in this data)
    Q5051: DET           # possessive determiner (your, our)
    Q36484: CONJ         # conjunction
    Q4833830: ADP        # preposition
    Q10319522: ADP       # prepositional locution (on behalf of)
    Q83034: INTJ         # interjection
    Q10319520: INTJ      # interjectional locution
    Q63116: NUM          # numeral
    Q36224: PRON         # pronoun
    Q468801: PRON        # personal pronoun
    Q956030: PRON        # indefinite pronoun
    Q1989081: PRON       # reflexive pronoun
    Q54310231: PRON      # interrogative word
    Q1527589: VERB       # phrasal verb
    Q1778442: VERB       # verb phrase
    Q10976085: VERB      # verbal locution
    Q1401131: NOUN       # noun phrase
    Q217438: NOUN        # demonym (noun)
    Q81058955: ADJ       # demonym (adjective)
    Q3734650: ADV        # adverbial phrase
    Q5978303: ADV        # adverbial locution
    Q3397768: ADV        # prepositional phrase (adverbial, as for Wiktionary)
    Q1469454: ADJ        # adjectival phrase
    "*": X               # affixes, idioms, proverbs, abbreviations, other
  wikidata_items: {item: "NOUN|PROPN"}
  ncbi_taxonomy: {taxon: PROPN}
  gene_ontology: {term: NOUN}
  chebi: {entity: NOUN}
  mesh: {descriptor: NOUN, geographic: PROPN, "scr:chemical": NOUN, "scr:rare disease": NOUN,
         "scr:organism": "NOUN|PROPN"}
  snomed_ct_uk: {"sct:": NOUN}
coordinating_conjunctions: ["and", "or", "but", "nor", "yet", "so", "for", "plus", "minus",
  "either", "neither", "both", "et", "&", "'n'", "n'", "'n", "an'", "versus", "vs", "vs.",
  "and/or", "times", "nor yet", "but also", "as well as", "let alone", "rather than"]
# OEWN nouns that are named entities become PROPN: senses only present in the 2025+ edition
# (Open English Namenet) and senses whose synset has an instance_hypernym.
oewn_propn_when: [namenet, instance]

alt_of:
  # alt-of senses carrying one of these tags are distinct lexical items (NASA, ad, 'cause):
  # they stay senses. Every other alt-of sense is an orthographic variant.
  abbreviation_tags: [abbreviation, initialism, acronym, clipping, ellipsis, contraction]
# Untagged Wiktionary senses whose entire gloss is "<qualifiers> spelling/form of X"
# ("Dated spelling of jail.") are routed to variants as well.
detect_untagged_variants: true

entry_forms:
  variant_tags: [alternative]                        # headword-line alternative spellings
  skip_tags: [canonical, romanization, table-tags, inflection-template, class, error-unknown-tag]

# Exact duplicates within one source (same lemma, UPOS, gloss path, gloss, tags) are data
# artefacts, not distinctions: keep the first, map the rest via dedupe_map. none | exact
dedupe: exact
