# MeSH 2026 -> descriptor and supplementary-concept senses. Run:
#   uv run python -m senselm.ingest.mesh --config configs/ingest_mesh.yaml
stage: ingest.mesh
manifest: data/raw/MANIFEST.json
source_name: mesh_descriptors
descriptors: data/raw/mesh/desc2026.xml
supplementary: data/raw/mesh/supp2026.xml
output: data/interim/senses_raw_mesh.parquet
# single-word NCBI scientific names decide which capitalised words are genera (keep their case)
taxon_names: data/raw/ncbi_taxonomy/taxdmp_2026-11-01.zip
descriptor_classes: [1, 2, 3, 4]     # topical, publication type, check tag, geographic
scr_classes: [1, 3, 4]               # chemical, rare disease, organism (not protocols etc.)
tree_domains: {A: anatomy, B: biology, C: medicine, D: pharmacology, E: medicine, F: psychology,
               G: biology, H: science, I: social-sciences, J: technology, K: humanities,
               L: information-science, M: social-sciences, N: health-care, V: publishing, Z: geography}
scr_domains: {chemical: chemistry, "rare disease": medicine, organism: biology}
