# Raw source downloads (Phase 1). Run:
#   uv run python -m senselm.ingest.download --config configs/download.yaml
# sha256 pins make the stage deterministic: if an upstream file changes, the run fails and the
# pin (and `version`) must be updated deliberately. kaikki.org only serves the latest weekly
# extraction, so archive data/raw/ if you need to reproduce a build bit-for-bit later.
stage: download
manifest: data/raw/MANIFEST.json
timeout_s: 120
sources:
  - name: wiktionary
    url: https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl.gz
    path: data/raw/wiktionary/kaikki.org-dictionary-English.jsonl.gz
    version: "kaikki.org English 2026-10-25 (enwiktionary dump 2026-10-01; wiktextract f9fe161+6f96ddf)"
    licence: "CC BY-SA 4.0 and GFDL (Wiktionary content)"
    sha256: 3ff7bef28ce7ad077ea55cedd9bde2cb7981c40f68adf63c8ceea347341392dc
  # Open English WordNet 2025+ = OEWN 2025 lexical items + curated proper nouns from Open
  # English Namenet ("coverage similar to previous OEWN releases"). URL is the one the `wn`
  # package (v1.1.1) indexes as oewn:2025+; the GitHub release asset is byte-identical.
  - name: oewn
    url: https://en-word.net/static/english-wordnet-2025-plus.xml.gz
    path: data/raw/oewn/english-wordnet-2025-plus.xml.gz
    version: "oewn:2025+ (2025-12-31)"
    licence: "CC BY 4.0"
    sha256: 31f4af16c54b532fd5484d4cc33aee588a31bb5b70683ae8197842fde5b586bc
  # The base 2025 edition is used only to flag which senses come from Open English Namenet.
  - name: oewn_base
    url: https://en-word.net/static/english-wordnet-2025.xml.gz
    path: data/raw/oewn/english-wordnet-2025.xml.gz
    version: "oewn:2025 (2025-12-31)"
    licence: "CC BY 4.0"
    sha256: 9ca6d1dcb75f822fdd66617f7d9da48142ace38dd544d6ad5e2feca1674ad3fe
  # ---------------------------------------------------------------- Phase 2 (domain extension)
  # Dated dump URLs where publishers provide them; sha256 pinned after the first download.
  - name: wikidata_lexemes
    url: https://dumps.wikimedia.org/wikidatawiki/entities/20261028/wikidata-20261028-lexemes.json.gz
    path: data/raw/wikidata/wikidata-20261028-lexemes.json.gz
    version: "Wikidata lexemes dump 2026-10-28"
    licence: "CC0 1.0"
    sha256: 1f0d5b11ff3eaad4255c33ff23d7eed0b9394985945f25829a15e0702394896b
    md5: b7513e4dcd3dcd526e32c9646f9ffed6        # from wikidata-20261028-md5sums.txt
  - name: ncbi_taxonomy
    url: https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump_archive/taxdmp_2026-11-01.zip
    path: data/raw/ncbi_taxonomy/taxdmp_2026-11-01.zip
    version: "NCBI Taxonomy taxdump, monthly archive 2026-11-01"
    licence: "Public domain (NCBI / U.S. National Library of Medicine); citation requested"
    sha256: bca3df962e06e9d27bb94aa93d56ed2f0e2190dc32dbb03f4be6ad13153ecc02
  - name: gene_ontology
    url: https://current.geneontology.org/ontology/go.obo
    path: data/raw/go/go.obo
    version: "GO release 2026-07-26 (data-version: releases/2026-07-26)"
    licence: "CC BY 4.0"
    sha256: d3593751d885ca160b2ab7baf6c7eccd88ca3c4599f79436c674bad661095ff0
  - name: chebi
    url: https://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel255/ontology/chebi.obo.gz
