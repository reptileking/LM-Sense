[project]
name = "senselm"
version = "0.1.0"
description = "SenseLM: sense-level tokenization and an interlingua language model (research system)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Code: MIT. Data products inherit source licences, see docs/LICENSES.md" }
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=17",
    "orjson>=3.10",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "torch>=2.5",
    "transformers>=4.46",
    "tokenizers>=0.20",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "psutil>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["senselm"]

# CPU-only PyTorch: this machine has no GPU, and the CUDA wheels cost ~2.5 GB of disk.
# On a GPU machine, delete this source mapping (or point it at a CUDA index).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: tests that need built artefacts under data/ (skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
